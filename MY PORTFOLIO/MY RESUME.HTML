<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Resume | Muhammad Shafeeq KP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a192f;
            --card: #112240;
            --line: #1a2e50;
            --head: #ccd6f6;
            --mute: #8892b0;
            --acc: #64ffda;
            --mono: 'JetBrains Mono', ui-monospace, monospace
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--mute);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(ellipse at 8% 50%, rgba(100, 255, 218, .03), transparent 46%), radial-gradient(ellipse at 100% 18%, rgba(0, 0, 0, .24), transparent 52%), linear-gradient(rgba(100, 255, 218, .028) 1px, transparent 1px), linear-gradient(90deg, rgba(100, 255, 218, .028) 1px, transparent 1px);
            background-size: auto, auto, 40px 40px, 40px 40px;
            background-attachment: fixed
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .mono {
            font-family: var(--mono)
        }

        /* ---------- nav (same as home page) ---------- */
        .nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 50;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 22px;
            background: rgba(10, 25, 47, .88);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px -12px rgba(2, 12, 27, .75);
            opacity: 0;
            transform: translateY(-100%);
            transition: .7s ease
        }

        body.go .nav {
            opacity: 1;
            transform: none
        }

        .logo {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: .03em;
            color: var(--acc)
        }

        .burger {
            background: none;
            border: 0;
            width: 34px;
            height: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 0;
            cursor: pointer
        }

        .burger span {
            height: 2.5px;
            background: var(--acc);
            border-radius: 2px;
            transition: .3s
        }

        .burger[aria-expanded=true] span:nth-child(1) {
            transform: translateY(8.5px) rotate(45deg)
        }

        .burger[aria-expanded=true] span:nth-child(2) {
            opacity: 0
        }

        .burger[aria-expanded=true] span:nth-child(3) {
            transform: translateY(-8.5px) rotate(-45deg)
        }

        .scrim {
            position: fixed;
            inset: 0;
            z-index: 55;
            background: rgba(0, 0, 0, .45);
            opacity: 0;
            pointer-events: none;
            transition: .3s
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 70%;
            max-width: 320px;
            z-index: 60;
            background: var(--bg);
            padding: 90px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transform: translateX(100%);
            transition: transform .35s ease;
            border-left: 1px solid var(--line)
        }

        .drawer a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 12px;
            color: #e6f1ff;
            transition: .25s
        }

        .drawer a:hover,
        .drawer a.active {
            border-color: var(--acc);
            color: var(--acc)
        }

        .drawer svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: .8
        }

        body.open .drawer {
            transform: none
        }

        body.open .scrim {
            opacity: 1;
            pointer-events: auto
        }

        .iconnav {
            display: none
        }

        .iconnav a {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px clamp(12px, 2vw, 30px);
            color: var(--mute);
            transition: color .25s, transform .25s
        }

        .iconnav svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .iconnav a:hover,
        .iconnav a.active {
            color: var(--acc);
            transform: translateY(-2px)
        }

        @media (min-width: 768px) {
            .nav {
                height: 72px;
                padding: 0 clamp(24px, 3.1vw, 60px)
            }

            .iconnav {
                display: flex
            }

            .burger,
            .drawer,
            .scrim {
                display: none !important
            }
        }

        /* ---------- resume section ---------- */
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 150px 22px 70px;
            text-align: center
        }

        .page>* {
            opacity: 0;
            transform: translateY(22px)
        }

        body.go .page>* {
            animation: enter .8s cubic-bezier(.2, .7, .2, 1) forwards
        }

        body.go .page> :nth-child(1) {
            animation-delay: .1s
        }

        body.go .page> :nth-child(2) {
            animation-delay: .25s
        }

        body.go .page> :nth-child(3) {
            animation-delay: .4s
        }

        body.go .page> :nth-child(4) {
            animation-delay: .55s
        }

        @keyframes enter {
            to {
                opacity: 1;
                transform: none
            }
        }

        h1 {
            font-size: clamp(1.5rem, 3.4vw, 2.7rem);
            font-weight: 700;
            line-height: 1.3;
            color: var(--head);
            max-width: 1100px
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: clamp(26px, 4vw, 50px) 0
        }

        .social svg {
            width: 32px;
            height: 32px;
            fill: var(--mute);
            transition: fill .25s, transform .25s
        }

        .social a:hover svg {
            fill: var(--acc);
            transform: translateY(-3px)
        }

        .lines {
            font-size: clamp(.95rem, 1.3vw, 1.2rem);
            line-height: 1.7;
            color: var(--mute)
        }

        .lines .t1 {
            color: #8892b0
        }

        .lines .t2 {
            opacity: .75
        }

        .caret {
            display: inline-block;
            width: 2px;
            height: 1.05em;
            background: var(--acc);
            vertical-align: -3px;
            margin-left: 3px;
            animation: blink 1s steps(1) infinite
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        /* smaller Download / View buttons */
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: clamp(24px, 3vw, 40px)
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--acc);
            color: var(--acc);
            font-weight: 600;
            font-size: .82rem;
            line-height: 1.3;
            transition: .25s
        }

        .btn svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .btn.primary {
            background: var(--acc);
            color: #06201a
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(100, 255, 218, .25)
        }

        /* ---------- cursor ring (as on the home page) ---------- */
        .cursor {
            position: fixed;
            left: 0;
            top: 0;
            width: 30px;
            height: 30px;
            margin: -15px 0 0 -15px;
            border: 2px solid var(--acc);
            border-radius: 50%;
            pointer-events: none;
            z-index: 300;
            opacity: 0;
            transition: width .25s, height .25s, margin .25s, background .25s, opacity .3s;
            will-change: transform
        }

        .cursor.on {
            opacity: 1
        }

        .cursor.big {
            width: 52px;
            height: 52px;
            margin: -26px 0 0 -26px;
            background: rgba(100, 255, 218, .1)
        }

        @media (hover: hover) and (pointer: fine) {

            html.has-cursor,
            html.has-cursor * {
                cursor: none !important
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important
            }

            .nav,
            .page>* {
                opacity: 1;
                transform: none
            }
        }
    </style>
</head>

    <script>
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, body = document.body;
        const btn = document.getElementById("menuBtn"), setMenu = o => { body.classList.toggle("open", o); btn.setAttribute("aria-expanded", o) };
        btn.onclick = () => setMenu(!body.classList.contains("open"));
        document.getElementById("scrim").onclick = () => setMenu(false);
        document.querySelectorAll("#drawer a").forEach(a => a.addEventListener("click", () => setMenu(false)));
        addEventListener("keydown", e => e.key === "Escape" && setMenu(false));

        (function () {
            const c = document.getElementById("cursor");
            if (!c || reduce || !matchMedia("(hover:hover) and (pointer:fine)").matches) return;
            document.documentElement.classList.add("has-cursor");
            let x = -100, y = -100, cx = x, cy = y;
            addEventListener("pointermove", e => { x = e.clientX; y = e.clientY; c.classList.add("on"); c.classList.toggle("big", !!(e.target.closest && e.target.closest("a,button"))) });
            document.addEventListener("pointerleave", () => c.classList.remove("on"));
            (function loop() { cx += (x - cx) * .22; cy += (y - cy) * .22; c.style.transform = "translate(" + cx + "px," + cy + "px)"; requestAnimationFrame(loop) })();
        })();
    </script>
