<head>

    <style>
        :root {
            --bg: #0a1128;
            --card: #111f40;
            --line: #1d2f5a;
            --txt: #c3cde6;
            --head: #d6defa;
            --mute: #7f8fb3;
            --acc: #6ee7c8;
            --mono: 'JetBrains Mono', ui-monospace, monospace
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--txt);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 12%, rgba(110, 231, 200, .09), transparent 40%), radial-gradient(circle at 85% 75%, rgba(80, 110, 255, .1), transparent 45%), linear-gradient(rgba(110, 231, 200, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(110, 231, 200, .035) 1px, transparent 1px);
            background-size: auto, auto, 36px 36px, 36px 36px;
            background-attachment: fixed
        }

        body.lock {
            overflow: hidden
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .mono {
            font-family: var(--mono)
        }

        .accent {
            color: var(--acc)
        }

        /* Pac-Man loader */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity .6s ease, visibility .6s
        }

        .loader.done {
            opacity: 0;
            visibility: hidden
        }

        .pac {
            position: relative;
            width: 46px;
            height: 46px
        }

        .pac::before,
        .pac::after {
            content: "";
            position: absolute;
            left: 0;
            width: 46px;
            height: 23px;
            background: #fff
        }

        .pac::before {
            top: 0;
            border-radius: 46px 46px 0 0;
            transform-origin: 50% 100%;
            animation: up .3s ease-in-out infinite alternate
        }

        .pac::after {
            top: 23px;
            border-radius: 0 0 46px 46px;
            transform-origin: 50% 0;
            animation: down .3s ease-in-out infinite alternate
        }

        @keyframes up {
            to {
                transform: rotate(-32deg)
            }
        }

        @keyframes down {
            to {
                transform: rotate(32deg)
            }
        }

        .dots {
            display: flex;
            gap: 18px
        }

        .dots i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            animation: eat 1.2s linear infinite
        }

        .dots i:nth-child(2) {
            animation-delay: .2s
        }

        .dots i:nth-child(3) {
            animation-delay: .4s
        }

        @keyframes eat {
            0% {
                transform: translateX(26px);
                opacity: 0
            }

            20% {
                opacity: 1
            }

            85% {
                opacity: 1
            }

            100% {
                transform: translateX(-62px);
                opacity: 0
            }
        }

        /* nav */
        .nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 50;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(10, 17, 40, .8);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(-100%);
            transition: .7s ease
        }

        .logo {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1.02rem;
            letter-spacing: .04em;
            color: var(--acc)
        }

        .burger {
            background: none;
            border: 0;
            width: 34px;
            height: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 0;
            cursor: pointer
        }

        .burger span {
            height: 2.5px;
            background: var(--acc);
            border-radius: 2px;
            transition: .3s
        }

        .burger[aria-expanded=true] span:nth-child(1) {
            transform: translateY(8.5px) rotate(45deg)
        }

        .burger[aria-expanded=true] span:nth-child(2) {
            opacity: 0
        }

        .burger[aria-expanded=true] span:nth-child(3) {
            transform: translateY(-8.5px) rotate(-45deg)
        }

        .scrim {
            position: fixed;
            inset: 0;
            z-index: 55;
            background: rgba(0, 0, 0, .45);
            opacity: 0;
            pointer-events: none;
            transition: .3s
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 70%;
            max-width: 320px;
            z-index: 60;
            background: #0b1530;
            padding: 90px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transform: translateX(100%);
            transition: transform .35s ease;
            border-left: 1px solid var(--line)
        }

        .drawer a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 12px;
            color: var(--head);
            transition: .25s
        }

        .drawer a:hover,
        .drawer a.active {
            border-color: var(--acc);
            color: var(--acc)
        }

        .drawer svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: .8
        }

        body.open .drawer {
            transform: none
        }

        body.open .scrim {
            opacity: 1;
            pointer-events: auto
        }

        /* hero */
        .hero {
            max-width: 760px;
            margin: auto;
            padding: 110px 20px 40px;
            min-height: 100svh
        }

        .hero>* {
            opacity: 0;
            transform: translateY(26px)
        }

        body.go .nav {
            opacity: 1;
            transform: none
        }

        body.go .hero>* {
            animation: enter .85s cubic-bezier(.2, .7, .2, 1) forwards
        }

        body.go .hero>:nth-child(1) {
            animation-delay: .1s
        }

        body.go .hero>:nth-child(2) {
            animation-delay: .3s
        }

        body.go .hero>:nth-child(3) {
            animation-delay: .6s
        }

        body.go .hero>:nth-child(4) {
            animation-delay: .95s
        }

        body.go .hero>:nth-child(5) {
            animation-delay: 2.3s
        }

        @keyframes enter {
            to {
                opacity: 1;
                transform: none
            }
        }

        .hey {
            font-size: 1.05rem
        }

        h1 {
            font-size: clamp(2.4rem, 11vw, 3.8rem);

            font-weight: 700;
            color: var(--head);

        .term {

        .term-bar {

        .caret {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--acc);
            vertical-align: -2px;
            margin-left: 2px;
            animation: blink 1s steps(1) infinite
        }

        @keyframes blink {

            }

        .photo-wrap {
            display: flex;
            justify-content: center;
            margin: 36px 0 24px;
            perspective: 900px
        }

        .photo {
            width: min(72vw, 300px);
            aspect-ratio: 3/4;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: linear-gradient(160deg, #0e1a38, #0a1530);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
            transform: rotateZ(var(--r, 0deg)) rotateX(var(--x, 0deg));
            transition: filter .5s, border-color .5s, box-shadow .5s, transform .15s linear
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
            clip-path: inset(0 0 100% 0)
        }

        body.go .photo img {
            animation: wipe 1.3s 1.4s cubic-bezier(.65, 0, .25, 1) forwards
        }

        @keyframes wipe {
            to {
                clip-path: inset(0 0 0 0)
            }
        }

        .photo:hover,
        .photo:active {
            filter: grayscale(1) contrast(1.08);
            border-color: rgba(255, 255, 255, .55);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5), 0 0 40px rgba(255, 255, 255, .12)
        }

        .cta {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap
        }

        .btn {
            padding: 12px 22px;
            border-radius: 10px;
            border: 1px solid var(--acc);
            color: var(--acc);
            font-weight: 600;
            font-size: .9rem;

        }

        .btn.primary {

        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(110, 231, 200, .25)
        }

        .foot {
            max-width: 760px;
            margin: 30px auto 0;
            padding: 30px 20px 60px;
            text-align: center
        }

        .foot h2 {
            font-size: clamp(1.2rem, 5.2vw, 1.6rem);
            font-weight: 600;
            color: var(--head);
            line-height: 1.3
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 18px 0
        }

        .social svg {
            width: 24px;
            height: 24px;
            fill: var(--mute);
            transition: .25s
        }

        .social a:hover svg {
            fill: var(--acc);
            transform: translateY(-3px)
        }

        .t1 {
            font-size: .85rem
        }

        .t2 {

            color: var(--mute);
            opacity: .7
        }

        .wrap {
            max-width: 760px;
            margin: auto;
            padding: 0 20px
        }

        .sec {
            padding: 50px 0 10px
        }

        h2 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #e6ecfa;
            margin-bottom: 20px;
            line-height: 1.3
        }

        h2 span {
            color: var(--acc)
        }

        h2.rule {
            display: flex;
            align-items: center;
            gap: 14px
        }

        h2.rule::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line)
        }

        .sec p {
            margin-bottom: 16px;
            color: var(--mute)
        }

        .art {
            width: min(78vw, 300px);
            margin: 40px auto 10px
        }

        .art svg {
            width: 100%;
            overflow: visible
        }

        .art svg * {
            transform-box: fill-box;
            transform-origin: center
        }

        .bob {
            animation: bob 4.5s ease-in-out infinite
        }

        .b2 {
            animation-duration: 3.6s;
            animation-delay: -1s
        }

        .rk {
            animation: bob 3.2s ease-in-out infinite;
            animation-delay: -.6s
        }

        @keyframes bob {
            50% {
                transform: translateY(-10px)
            }
        }

        .spin {
            animation: spin 8s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .flame {
            transform-origin: 50% 0;
            animation: fl .18s ease-in-out infinite alternate
        }

        @keyframes fl {
            to {
                transform: scaleY(1.35)
            }
        }

        .tw {
            animation: tw 2.4s ease-in-out infinite
        }

        .tw.d2 {
            animation-delay: .8s
        }

        .tw.d3 {
            animation-delay: 1.5s
        }

        @keyframes tw {
            50% {
                opacity: .15
            }
        }

        .cl {
            stroke-dasharray: 80;
            animation: cl 4s ease-in-out infinite
        }

        .c2 {
            animation-delay: .3s
        }

        .c3 {
            animation-delay: .6s
        }

        .c4 {
            animation-delay: .9s
        }

        .c5 {
            animation-delay: 1.2s
        }

        @keyframes cl {
            0% {
                stroke-dashoffset: 80
            }

            35%,
            85% {
                stroke-dashoffset: 0
            }

            100% {
                stroke-dashoffset: -80
            }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 3px solid var(--acc);
            border-radius: 14px;
            padding: 18px;
            transition: .3s
        }

        .stat:hover {
            transform: translateY(-4px);
            border-color: rgba(110, 231, 200, .5)
        }

        .stat b {
            display: block;
            font-family: var(--mono);
            font-size: 2rem;
            color: var(--acc);
            line-height: 1.1
        }

        .stat b::after {
            content: "+"
        }

        .stat span {
            font-size: .8rem;
            color: var(--mute);
            line-height: 1.4;
            display: block;
            margin-top: 6px
        }

        .marq {
            overflow: hidden;
            margin: 46px 0 10px;
            mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent)
        }

        .track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: mq 32s linear infinite
        }

        .marq:hover .track {
            animation-play-state: paused
        }

        .track span {
            font-family: var(--mono);
            font-size: .78rem;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(110, 231, 200, .1);
            color: var(--acc);
            border: 1px solid rgba(110, 231, 200, .2);
            white-space: nowrap
        }

        @keyframes mq {
            to {
                transform: translateX(-50%)
            }
        }

        .reveal {
            opacity: 0;
            transform: translateY(32px);
            transition: opacity .7s ease, transform .7s ease
        }

        .reveal.in {
            opacity: 1;
            transform: none
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important
            }

            .loader {
                display: none
            }

            .nav,
            .hero>* {
                opacity: 1;
                transform: none
            }

            .photo img {
                clip-path: none
            }

            .reveal {
                opacity: 1;
                transform: none

        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, body = document.body;
        const btn = document.getElementById("menuBtn"), setMenu = o => { body.classList.toggle("open", o); btn.setAttribute("aria-expanded", o) };
        btn.onclick = () => setMenu(!body.classList.contains("open"));
        document.getElementById("scrim").onclick = () => setMenu(false);
        document.querySelectorAll("#drawer a").forEach(a => a.addEventListener("click", () => setMenu(false)));
        addEventListener("keydown", e => e.key === "Escape" && setMenu(false));
        const io = new IntersectionObserver(es => es.forEach(e => {
            const t = e.target;
            if (e.isIntersecting) { t.classList.add("in"); t.classList.remove("dim") }
            else if (t.classList.contains("in") && e.boundingClientRect.top < 0 && t.matches(".card") && !reduce) { t.classList.add("dim") }
        }), { threshold: .12, rootMargin: "0px 0px -6% 0px" });
        document.querySelectorAll(".reveal").forEach(n => io.observe(n));
    </script>
